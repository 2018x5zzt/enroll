name: Freeze at the deadline

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      window:
        description: Which deadline to cut off at; the warm-up is only rehearsed
        type: choice
        options:
          - contest
          - warmup
        default: contest
      dry_run:
        description: Only print what would be recorded, and change nothing
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  freeze:
    concurrency:
      group: enroll
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app
        if: vars.ENROLL_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.ENROLL_APP_CLIENT_ID }}
          private-key: ${{ secrets.ENROLL_APP_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Record each contest entry's commit at the deadline and archive it, or rehearse that
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.ENROLL_TOKEN }}
          ISSUE_TOKEN: ${{ github.token }}
          PREFIX: ${{ vars.PREFIX }}
          WINDOW: ${{ inputs.window }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 -u freeze.py
